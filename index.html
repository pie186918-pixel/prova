<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetMicro - Analisi Citologica AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: #38bdf8;
        }

        p.subtitle {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
        }

        input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-btn {
            background-color: #334155;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px dashed #64748b;
        }

        #preview {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        #result {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .success { color: var(--accent); }
        .error { color: #f43f5e; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔬 VetMicro AI</h1>
        <p class="subtitle">Analisi Citologica da Smartphone via ChatGPT API</p>
    </header>

    <!-- Sezione API Key -->
    <div class="card">
        <h2>1. Chiave API OpenAI</h2>
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="sk-proj-...">
            <button onclick="saveApiKey()">Salva</button>
        </div>
        <div id="keyStatus" class="status-msg"></div>
    </div>

    <!-- Sezione Upload Foto -->
    <div class="card">
        <h2>2. Foto Vetrino</h2>
        <div class="file-input-wrapper">
            <label for="imageInput" class="custom-file-btn">📸 Scatta o Seleziona Foto</label>
            <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewImage(event)">
            <img id="preview" alt="Anteprima Vetrino">
        </div>
    </div>

    <!-- Sezione Prompt facoltativo -->
    <div class="card">
        <h2>3. Note operative (opzionale)</h2>
        <textarea id="customPrompt" rows="2" placeholder="Es. Vetrino di agoaspirato cutaneo cane. Valuta la presenza di neutrofili o batteri."></textarea>
    </div>

    <!-- Pulsante di Invio -->
    <button id="sendBtn" onclick="analyzeImage()" style="width: 100%; padding: 14px; font-size: 1rem;" disabled>
        🚀 Analizza Vetrino
    </button>

    <!-- Risultato -->
    <div class="card" id="resultCard" style="display: none;">
        <h2>📊 Esito Analisi</h2>
        <div id="result">In attesa dell'elaborazione...</div>
    </div>
</div>

<script>
    // Carica la chiave API salvata se presente
    document.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('openai_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            showKeyStatus('Chiave API salvata nel browser.', true);
        }
    });

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key.startsWith('sk-')) {
            localStorage.setItem('openai_api_key', key);
            showKeyStatus('Chiave salvata correttamente!', true);
        } else {
            showKeyStatus('Inserisci una chiave API OpenAI valida.', false);
        }
    }

    function showKeyStatus(msg, isSuccess) {
        const el = document.getElementById('keyStatus');
        el.textContent = msg;
        el.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
    }

    let base64Image = null;

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview');
                img.src = e.target.result;
                img.style.display = 'block';
                base64Image = e.target.result;
                document.getElementById('sendBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        }
    }

    async function analyzeImage() {
        const apiKey = localStorage.getItem('openai_api_key') || document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert('Inserisci prima una chiave API OpenAI valida!');
            return;
        }

        if (!base64Image) {
            alert('Carica una foto prima di avviare l\'analisi.');
            return;
        }

        const btn = document.getElementById('sendBtn');
        const resultCard = document.getElementById('resultCard');
        const resultDiv = document.getElementById('result');

        btn.disabled = true;
        btn.textContent = '⏳ Analisi in corso...';
        resultCard.style.display = 'block';
        resultDiv.textContent = 'Caricamento dell\'immagine ed elaborazione da parte di ChatGPT in corso...';

        const customPromptText = document.getElementById('customPrompt').value.trim();
        const systemInstruction = "Sei un assistente esperto in citologia veterinaria. Analizza l'immagine microscopica fornita, descrivi le strutture cellulari o gli elementi visibili e fornisci una stima qualitativa/quantitativa rilevante.";
        const userPrompt = customPromptText ? `${systemInstruction}\nNote aggiuntive dell'utente: ${customPromptText}` : systemInstruction;

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [
                        {
                            role: 'user',
                            content: [
                                { type: 'text', text: userPrompt },
                                { type: 'image_url', image_url: { url: base64Image } }
                            ]
                        }
                    ],
                    max_tokens: 800
                })
            });

            const data = await response.json();

            if (data.error) {
                resultDiv.textContent = '❌ Errore API: ' + data.error.message;
            } else {
                resultDiv.textContent = data.choices[0].message.content;
            }
        } catch (err) {
            resultDiv.textContent = '❌ Errore durante la richiesta: ' + err.message;
        } finally {
            btn.disabled = false;
            btn.textContent = '🚀 Analizza Vetrino';
        }
    }
</script>

</body>
</html>
